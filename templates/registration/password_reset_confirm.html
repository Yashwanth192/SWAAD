{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="card shadow mx-auto" style="max-width: 520px;">
        <div class="card-body">
            <h2 class="mb-3">Set a new password</h2>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-success">Update password</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
